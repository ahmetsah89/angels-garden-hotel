<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angels Garden Hotel - Yenileniyoruz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000;
        }

        .coming-soon-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        .content-overlay {
            position: absolute;
            bottom: 4%;
            left: 0;
            width: 100%;
            z-index: 2;
            display: flex;
            justify-content: center;
            padding: 0 15px;
        }

        .buttons-wrapper {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .custom-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 50px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .custom-btn:hover {
            transform: translateY(-2px);
            opacity: 0.95;
        }

        .whatsapp-btn { background-color: #128C7E; }
        .reservation-btn { background-color: #b91c3c; }

        .icon {
            display: flex;
            align-items: center;
        }

        .arrow {
            font-weight: bold;
        }

        @media (max-width: 768px) {
            .content-overlay {
                bottom: 3%;
            }
            .custom-btn {
                padding: 10px 18px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <div class="coming-soon-container">
        <!-- Arka Plan Görseli -->
        <img src="8E5E388A-D1F2-431D-BCAD-239552F261BF.png" alt="Angels Garden Hotel" class="bg-image">
        
        <!-- Buton Katmanı -->
        <div class="content-overlay">
            <div class="buttons-wrapper">
                <!-- WhatsApp -->
                <a href="https://wa.me/905419027047" target="_blank" class="custom-btn whatsapp-btn">

                    </span>

                <!-- Rezervasyon -->
                <a href="tel:+905419027047" class="custom-btn reservation-btn">

                        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>

            </div>
        </div>
    </div>

</body>
</html>
