<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#123b2c">
<title>Angel’s Garden Hotel | Çok Yakında</title>
<style>
:root{--green:#123b2c;--deep:#08271d;--gold:#d9bd7b;--cream:#fff8e9;--muted:#e9dfc8}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Georgia,'Times New Roman',serif;color:var(--cream)}
body{min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 50% 42%,#1d513c 0%,var(--green) 52%,var(--deep) 100%);overflow-x:hidden}
.scene{width:min(100%,900px);min-height:min(760px,calc(100vh - 44px));position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:54px 22px 42px;border:1px solid rgba(217,189,123,.65);outline:1px solid rgba(217,189,123,.22);outline-offset:8px;overflow:hidden;background:linear-gradient(135deg,rgba(255,255,255,.025),transparent 45%,rgba(0,0,0,.12))}
.scene:before,.scene:after{content:"❦  ✿  ❦";position:absolute;color:var(--gold);opacity:.78;font-size:clamp(20px,4vw,35px);letter-spacing:8px;writing-mode:vertical-rl;top:30px;bottom:30px;display:flex;justify-content:space-around;pointer-events:none}
.scene:before{left:8px}.scene:after{right:8px;transform:scaleX(-1)}
.botanical{position:absolute;color:#c5b276;opacity:.7;font-size:clamp(30px,5vw,52px);pointer-events:none;line-height:1}
.b1{top:19px;left:24px;transform:rotate(-25deg)}.b2{top:19px;right:24px;transform:rotate(25deg)}.b3{bottom:18px;left:25px;transform:rotate(25deg)}.b4{bottom:18px;right:25px;transform:rotate(-25deg)}
.topline{color:var(--gold);font-size:12px;letter-spacing:5px;text-transform:uppercase;margin:0 0 24px}
.stars{color:var(--gold);font-size:24px;letter-spacing:13px;margin:0 0 20px;padding-left:13px}
h1{font-weight:400;font-size:clamp(34px,7.4vw,68px);line-height:1.08;letter-spacing:.015em;margin:0;white-space:nowrap;text-shadow:0 2px 18px rgba(0,0,0,.25)}
.hotel-rule{display:flex;align-items:center;gap:14px;width:min(420px,82%);margin:24px auto 20px;color:var(--gold)}.hotel-rule:before,.hotel-rule:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--gold))}.hotel-rule:after{transform:scaleX(-1)}.hotel-rule span{font-size:19px}
.slogan{font-size:clamp(15px,2.8vw,21px);font-style:italic;letter-spacing:.04em;color:#f0e5cb;margin:0 0 42px}
.coming{font-family:Arial,sans-serif;font-size:clamp(12px,2.2vw,15px);letter-spacing:6px;color:var(--gold);margin:0 0 14px;font-weight:500}.sub{font-family:Arial,sans-serif;font-size:13px;letter-spacing:1.2px;color:var(--muted);margin:0 0 28px}
.actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}.btn{font-family:Arial,sans-serif;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:13px 20px;min-width:178px;border:1px solid var(--gold);border-radius:2px;color:var(--cream);font-size:13px;letter-spacing:.4px;transition:background .2s,color .2s}.btn:hover{background:var(--gold);color:var(--deep)}.btn .symbol{font-size:17px}
.phone{margin-top:25px;color:var(--muted);font-family:Arial,sans-serif;font-size:13px;letter-spacing:1px}.foot{margin-top:32px;color:#c8b98f;font-size:11px;letter-spacing:2px;text-transform:uppercase}
@media(max-width:430px){.scene{padding:54px 16px 34px;min-height:calc(100vh - 44px)}.scene:before{left:2px}.scene:after{right:2px}h1{font-size:clamp(28px,7.1vw,34px);letter-spacing:0}.stars{font-size:20px;letter-spacing:10px}.btn{width:min(100%,250px)}.slogan{margin-bottom:34px}.topline{letter-spacing:3px}}
</style>
</head>
<body>
<main class="scene">
 <span class="botanical b1">❀</span><span class="botanical b2">❀</span><span class="botanical b3">❦</span><span class="botanical b4">❦</span>
 <p class="topline">Hoş geldiniz</p>
 <div class="stars" aria-label="Üç yıldız">✦ ✧ ✦</div>
 <h1>Angel’s Garden Hotel</h1>
 <div class="hotel-rule"><span>❦</span></div>
 <p class="slogan">Tarihin kalbi, şehrin huzuru</p>
 <p class="coming">YENİLENİYORUZ</p>
 <p class="sub">Çok yakında yeniden sizlerleyiz.</p>
 <div class="actions">
  <a class="btn" href="https://wa.me/905419027047" target="_blank" rel="noopener noreferrer"><span class="symbol">◉</span> WhatsApp ile iletişim</a>
  <a class="btn" href="https://t.me/+905419027047" target="_blank" rel="noopener noreferrer"><span class="symbol">➤</span> Telegram ile iletişim</a>
 </div>
 <div class="phone">+90 541 902 70 47</div>
 <div class="foot">Angel’s Garden Hotel · İstanbul</div>
</main>
</body>
</html>
