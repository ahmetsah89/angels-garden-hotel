
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Angel's Garden Hotel</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #183d2c;
    }

   .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }

    .hero img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    .link {
      position: absolute;
      top: 82.1%;
      height: 8.3%;
      display: block;
      border-radius: 999px;
    }

    .whatsapp {
      left: 36.3%;
      width: 13.2%;
    }

    .telegram {
      left: 51%;
      width: 13.2%;
    }
  </style>
</head>
<body>
  <main class="hero">
    <img src="8E5E388A-D1F2-431D-BCAD-239552F261BF.png" alt="Angel's Garden Hotel İstanbul silüeti">

    <a
      class="link whatsapp"
      href="https://wa.me/905419027047"
      aria-label="WhatsApp ile iletişim"
    ></a>

    <a
      class="link telegram"
      href="https://t.me/"
      aria-label="Telegram"
    ></a>
  </main>
</body>
</html>
