<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angels Garden Hotel - Yenileniyoruz</title>
    <style>
        body, html {
            margin: 0;
            padding: 0.1px; /* Mobil tarayıcılarda tam yükseklik hatasını önler */
            width: 100%;
            height: 100%;
            background-color: #0b2318; /* Arka plan koyu yeşil uyumlu ton */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        /* Görseli ve butonları taşıyan ana kutu */
        .landing-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 500px; /* Bilgisayarda da ideal boyutta tutar */
            background-image: url('8E5E388A-D1F2-431D-BCAD-239552F261BF.png');
            background-size: 100% 100%; /* Telefonda ve bilgisayarda yazının tamamının görünmesi için ekranı birebir doldurur */
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Tıklama alanları (WhatsApp ve Telegram butonları üstü) */
        .click-area {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 70%; /* Buton genişliği */
            max-width: 280px;
            height: 6%; /* Buton yüksekliği */
            border-radius: 30px;
            cursor: pointer;
            z-index: 10;
        }

        /* WhatsApp Buton Konumu */
        .whatsapp-link {
            bottom: 24%;
        }

        /* Telegram Buton Konumu */
        .telegram-link {
            bottom: 15%;
        }
    </style>
</head>
<body>

    <div class="landing-container">
        <!-- WhatsApp Linki (Numaranızı buraya yazın) -->
        <a href="https://wa.me/905XXXXXXXXXX" class="click-area whatsapp-link" target="_blank"></a>
        
        <!-- Telegram Linki (Kullanıcı adınızı buraya yazın) -->
        <a href="https://t.me/kullaniciadi" class="click-area telegram-link" target="_blank"></a>
    </div>

</body>
</html>
