<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angels Garden Hotel - Yenileniyoruz</title>
    <!-- Google Fonts: Şık otel fontları -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Great+Vibes&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000;
        }

        .coming-soon-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        /* Arka Plan Görseli */
        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            /* Arka planı hafif karartarak yazıların okunmasını sağlar */
            filter: brightness(0.85);
        }

        /* Üst / Orta Katman: Logo & Başlık Bilgileri */
        .header-content {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 900px;
            text-align: center;
            padding: 40px 20px 0 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Logo Simgesi / Çiçek Motifi */
        .brand-icon {
            width: 60px;
            height: auto;
            margin-bottom: 8px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        /* Yıldızlar */
        .stars {
            color: #d4af37;
            font-size: 18px;
            letter-spacing: 6px;
            margin-bottom: 12px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }

        /* Çizgili Yapı ve Otel İsmi */
        .title-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            gap: 15px;
        }

        .title-line {
            flex: 1;
            height: 1px;
            background: linear-gradient(to right, transparent, #d4af37, transparent);
            max-width: 150px;
        }

        .hotel-title {
            font-family: 'Cinzel', serif;
            font-size: clamp(1.8rem, 5vw, 3.8rem); /* Ekran boyutuna göre otomatik ölçeklenir */
            color: #e5c158;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 3px 10px rgba(0,0,0,0.8);
            line-height: 1.1;
        }

        .hotel-subtitle {
            font-family: 'Cinzel', serif;
            font-size: clamp(1rem, 2.5vw, 1.8rem);
            color: #ffffff;
            letter-spacing: 8px;
            margin-top: 5px;
            text-shadow: 0 2px 6px rgba(0,0,0,0.8);
        }

        /* Slogan (El Yazısı Stili) */
        .hotel-slogan {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(1.8rem, 4vw, 2.8rem);
            color: #ffffff;
            margin-top: 15px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.9);
            font-weight: normal;
        }

        /* Alt Katman: Butonlar */
        .content-overlay {
            position: relative;
            bottom: 4%;
            width: 100%;
            z-index: 2;
            display: flex;
            justify-content: center;
            padding: 0 15px;
        }

        .buttons-wrapper {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .custom-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 50px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            transition: transform 0.2s ease, opacity 0.2s ease;
            backdrop-filter: blur(5px);
        }

        .custom-btn:hover {
            transform: translateY(-2px);
            opacity: 0.95;
        }

        .whatsapp-btn { background-color: #128C7E; }
        .reservation-btn { background-color: #b91c3c; }

        .icon {
            display: flex;
            align-items: center;
        }

        .arrow {
            font-weight: bold;
        }

        /* Mobil Uyumluluk İnce Ayarları */
        @media (max-width: 768px) {
            .header-content {
                padding-top: 25px;
            }
            .title-line {
                display: none; /* Mobilde yan çizgileri gizleyerek yazıyı rahatlatır */
            }
            .content-overlay {
                bottom: 3%;
            }
            .custom-btn {
                padding: 10px 18px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <div class="coming-soon-container">
        <!-- Arka Plan Görseli (Boğaz / Otel Manzarası Resminiz) -->
        <img src="8E5E388A-D1F2-431D-BCAD-239552F261BF.png?v=999" alt="Angels Garden Hotel Background" class="bg-image">
        
        <!-- Canlı Başlık ve Logo Alanı -->
        <div class="header-content">
            <!-- Çiçek Logosu SVG (İsterseniz img etiketi ile kendi logo SVG/PNG dosyanızı koyabilirsiniz) -->
            <svg class="brand-icon" viewBox="0 0 100 80" fill="#d4af37">
                <path d="M50 0 C40 20 20 30 0 30 C20 40 30 60 50 80 C70 60 80 40 100 30 C80 30 60 20 50 0 Z" />
            </svg>

            <!-- Yıldızlar -->
            <div class="stars">★ ★ ★</div>

            <!-- Başlık ve Yan Çizgiler -->
            <div class="title-wrapper">
                <div class="title-line"></div>
                <h1 class="hotel-title">ANGELS GARDEN</h1>
                <div class="title-line"></div>
            </div>
            
            <div class="hotel-subtitle">HOTEL</div>

            <!-- Slogan -->
            <p class="hotel-slogan">Şehrin kalbi, bahçenin huzuru...</p>
        </div>

        <!-- Buton Katmanı -->
        <div class="content-overlay">
            <div class="buttons-wrapper">
                <!-- WhatsApp -->
                <a href="https://wa.me/905419027047" target="_blank" class="custom-btn whatsapp-btn">
                    <span class="icon">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38c1.45.79 3.08 1.21 4.79 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01C17.18 3.03 14.69 2 12.04 2zM12.04 20.1c-1.46 0-2.89-.39-4.13-1.13l-.3-.18-3.12.82.83-3.04-.2-.31c-.82-1.31-1.25-2.83-1.25-4.38 0-4.56 3.71-8.27 8.27-8.27 2.21 0 4.29.86 5.85 2.42 1.56 1.56 2.42 3.64 2.42 5.85 0 4.56-3.71 8.27-8.27 8.27zm4.53-6.19c-.25-.13-1.47-.73-1.7-.82-.23-.09-.39-.13-.56.13-.17.25-.64.82-.79.99-.15.17-.31.19-.56.06-.25-.13-1.05-.39-2-1.24-.74-.66-1.24-1.47-1.38-1.72-.15-.25-.02-.39.11-.52.11-.11.25-.31.38-.47.13-.17.17-.29.25-.48.09-.19.04-.36-.02-.5-.06-.13-.56-1.35-.77-1.85-.2-.48-.41-.42-.56-.43h-.48c-.17 0-.44.06-.67.31-.23.25-.88.86-.88 2.1 0 1.23.9 2.42 1.03 2.59.13.17 1.78 2.72 4.32 3.81.6.26 1.07.42 1.44.54.61.19 1.17.16 1.61.1.49-.07 1.47-.6 1.68-1.18.21-.58.21-1.07.15-1.18-.06-.11-.23-.17-.48-.3z"/></svg>
                    </span>
                    WhatsApp <span class="arrow">&rarr;</span>
                </a>

                <!-- Rezervasyon -->
                <a href="tel:+905419027047" class="custom-btn reservation-btn">
                    <span class="icon">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
                    </span>
                    Rezervasyon Yap <span class="arrow">&rarr;</span>
                </a>
            </div>
        </div>
    </div>

</body>
</html>
